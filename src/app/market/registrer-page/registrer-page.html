<div class="container">

  <h1>Registration Form</h1>

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

    <!-- Name -->
    <input
      type="text"
      placeholder="Name"
      formControlName="name"
      [class.invalid]="registerForm.get('name')?.touched && registerForm.get('name')?.invalid"
    >

    <!-- Email -->
    <input
      type="email"
      placeholder="Email Address"
      formControlName="email"
      [class.invalid]="registerForm.get('email')?.touched && registerForm.get('email')?.invalid"
    >

    <!-- Phone -->
    <input
      type="text"
      placeholder="Phone Number"
      formControlName="phone"
      [class.invalid]="registerForm.get('phone')?.touched && registerForm.get('phone')?.invalid"
    >

    <!-- Date of Birth -->
    <input
      type="date"
      formControlName="dob"
      [class.invalid]="registerForm.get('dob')?.touched && registerForm.get('dob')?.invalid"
    >

    <!-- Address -->
    <input
      type="text"
      placeholder="Street Address"
      formControlName="address"
      [class.invalid]="registerForm.get('address')?.touched && registerForm.get('address')?.invalid"
    >

    <!-- Province -->
    <select
      formControlName="province"
      [class.invalid]="registerForm.get('province')?.touched && registerForm.get('province')?.invalid"
    >

      <option value="">Select Province</option>

     @for (province of provinces; track province) {

  <option [value]="province">
    {{ province }}
  </option>

    }

    </select>

    <!-- Country -->
    <select
      formControlName="country"
      [class.invalid]="registerForm.get('country')?.touched && registerForm.get('country')?.invalid"
    >

      <option value="">Select Country</option>
      <option value="Canada">Canada</option>
      <option value="United States">United States</option>

    </select>

    <!-- Terms -->
    <label>

      <input type="checkbox" formControlName="terms">

      Accept Terms & Conditions

    </label>

    <button type="submit" [disabled]="registerForm.invalid" >
      Submit
    </button>

  </form>

</div>
